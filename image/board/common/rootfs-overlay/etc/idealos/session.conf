# Services started and supervised by session. On dev images, /data/session.conf
# replaces this file if it exists (e.g. without the compositor, to run kms-probe,
# which needs the display to itself).
# bus=broker gives busd session's own connection; bus=system and bus=app:ID give a
# service a bus connection session made for it (see crates/session).
# name         restart   [bus=ROLE]   command...
shell          always                 /bin/sh -l
bus            always    bus=broker   /usr/libexec/idealos/dev-exec busd
# Grants: before the services that enforce them, so they start with the table.
perm           always    bus=system   /usr/libexec/idealos/dev-exec permd
db             always    bus=system   /usr/libexec/idealos/dev-exec dbd
secrets        always    bus=system   /usr/libexec/idealos/dev-exec secretsd
# Shells for the terminal app, and the network through NetworkManager (M7).
pty            always    bus=system   /usr/libexec/idealos/dev-exec ptyd
net            always    bus=system   /usr/libexec/idealos/dev-exec netd
compositor     always    bus=system   /usr/libexec/idealos/dev-exec compositor --backend kms
# Installs the bundled apps into the database (preferring copies pushed to the dev
# overlay) and launches the autostart ones; session then runs each app as its own
# app-host, with an app:ID connection.
apps           never     bus=system   /usr/libexec/idealos/install-apps
