# mmcblk0p1 = boot (FAT, firmware + kernel), p2 = root-a, p3 = root-b, p4 = data
image boot.vfat {
	vfat {
		files = {
			"bcm2711-rpi-4-b.dtb",
			"rpi-firmware/start4.elf",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/overlays",
			"Image"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "data"
	}
	empty = true
	size = 2G
}

image sdcard.img {
	hdimage {
	}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}
	partition root-a {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
	partition root-b {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
