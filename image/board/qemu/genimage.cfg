# QEMU boots the kernel directly (-kernel), so there is no boot partition.
# vda1 = root-a, vda2 = root-b, vda3 = data
image data.ext4 {
	ext4 {
		label = "data"
	}
	empty = true
	size = 1G
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}
	partition root-a {
		image = "rootfs.ext4"
	}
	partition root-b {
		image = "rootfs.ext4"
	}
	partition data {
		image = "data.ext4"
	}
}
