[package]
name = "netd"
description = "The net service: Wi-Fi and connection status, over NetworkManager."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
protocol.workspace = true
bus-client.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
# NetworkManager's D-Bus API, on the tokio runtime.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
busd = { path = "../busd" }
