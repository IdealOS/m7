[package]
name = "compositor"
description = "Scene-graph compositor: wgpu renderer, hosted (winit) and KMS backends."
version.workspace = true
edition.workspace = true
license.workspace = true
# `cargo run -p compositor` runs the compositor; `--bin text-bench` the benchmark.
default-run = "compositor"

[features]
default = ["hosted"]
# Window on macOS/Linux desktops via winit. Used for day-to-day development.
hosted = ["dep:winit"]
# Direct DRM/KMS output and libinput input on the device. Linux only; see
# backend/kms/mod.rs. Needs libinput, libudev and libxkbcommon to link.
kms = ["dep:drm", "dep:input", "dep:xkbcommon"]

[dependencies]
protocol.workspace = true
serde_json.workspace = true
serde.workspace = true
libc = "0.2"
bus-client.workspace = true
tokio.workspace = true
wgpu.workspace = true
glyphon.workspace = true
taffy.workspace = true
pollster.workspace = true
bytemuck.workspace = true
png.workspace = true
log.workspace = true
env_logger.workspace = true
winit = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
drm = { version = "0.15", optional = true }
input = { version = "0.10", optional = true, default-features = false, features = ["udev", "libinput_1_21"] }
xkbcommon = { version = "0.9", optional = true, default-features = false }

