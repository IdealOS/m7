[workspace]
resolver = "3"
members = ["crates/protocol", "crates/compositor", "crates/session"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
winit = "0.30"
glyphon = "0.12"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
log = "0.4"
env_logger = "0.11"

[profile.dev.package."*"]
# Dependencies (wgpu, naga, cosmic-text) are slow in debug builds; optimize them
# so the hosted compositor stays smooth while our own crates build fast.
opt-level = 2
