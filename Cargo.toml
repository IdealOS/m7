[workspace]
resolver = "3"
members = ["crates/protocol", "crates/protocol-schema", "crates/db", "crates/dbd", "crates/busd", "crates/bus-client", "crates/osctl", "crates/compositor", "crates/session", "spikes/db-bench", "spikes/js-bench", "spikes/kms-probe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
bus-client = { path = "crates/bus-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
winit = "0.30"
glyphon = "0.12"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
log = "0.4"
env_logger = "0.11"
loro = "1.18"
rusqlite = { version = "0.43", features = ["bundled"] }
rquickjs = "0.14"
uuid = { version = "1.29", features = ["v7"] }
# The bus: one current-thread runtime per process is enough.
tokio = { version = "1.54", features = ["rt", "net", "io-util", "sync", "time", "macros", "signal"] }

[profile.dev.package."*"]
# Dependencies (wgpu, naga, cosmic-text) are slow in debug builds; optimize them
# so the hosted compositor stays smooth while our own crates build fast.
opt-level = 2
