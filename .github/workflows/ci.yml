name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kms-probe turns on the compositor's KMS backend, which links libinput,
      # libudev and libxkbcommon (the same packages tools/lima/idealos-build.yaml installs).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libinput-dev libudev-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Device build of the compositor (KMS backend only, no winit).
      - run: cargo check -p compositor --no-default-features --features kms
      # The GPU readback test skips itself when the runner has no adapter.
      - run: cargo test --workspace

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # The same major version as development machines. It runs tools/*.ts
          # directly (type stripping) and finds *.test.ts files.
          node-version: 26
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      # Type-checks and tests tools/, including that sdk/src/protocol.ts is
      # current with crates/protocol/schema.json (the rust job checks the schema).
      - run: tools/check-tools
      # Type-checks the SDK and its tests, and runs them against a fake app-host.
      - run: sdk/check
      # Bundles the apps the image ships, as tools/build-image does.
      - run: node tools/build-app.ts apps/*/
